name: Android 15 compatibility APK

on:
  workflow_dispatch:
  push:
    branches: [MODERN-ANDROID]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/android-modern.yml"

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # GitHub's ubuntu-latest image already includes Android cmdline-tools;
      # setup-android@v3 currently fails on the removed legacy 'tools' SDK package.
      - name: Install Android 36 SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort -V | tail -n 1)"
          test -n "$SDKMGR"
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle assemble debug
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload ARMv7 test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cod-boz-android15-armv7-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

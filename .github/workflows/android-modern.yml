name: Android 15 compatibility APK

on:
  workflow_dispatch:
  push:
    branches: [MODERN-ANDROID]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/android-modern.yml"

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle assemble debug
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload ARMv7 test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cod-boz-android15-armv7-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
